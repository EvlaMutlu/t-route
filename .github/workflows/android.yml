# T-Route: Android uygulamasını (APK) derler ve "Releases" sayfasına koyar.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "icon*"
      - "mobil/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web dosyalarını uygulamaya kopyala
        working-directory: mobil
        run: |
          mkdir -p www
          cp ../index.html ../manifest.webmanifest ../icon.svg ../icon-192.png ../icon-512.png www/

      - name: Bağımlılıklar
        working-directory: mobil
        run: npm ci

      - name: Capacitor eşitleme
        working-directory: mobil
        run: npx cap sync android

      - name: APK derle
        working-directory: mobil/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p ~/.android
          cp ../t-route-debug.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/T-Route.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: T-Route-apk
          path: T-Route.apk

      - name: Sürüm sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-1.0.${{ github.run_number }}
          name: T-Route Android 1.0.${{ github.run_number }}
          make_latest: true
          files: T-Route.apk
          body: |
            T-Route Android uygulaması. Telefonda bu sayfadan **T-Route.apk** dosyasını indirip açın.
            Kalıcı indirme bağlantısı: https://github.com/EvlaMutlu/t-route/releases/latest/download/T-Route.apk
